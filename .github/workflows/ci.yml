name: build

on:
  - push
  - pull_request

# Least privilege. Neither job writes to the repository or publishes anything.
permissions:
  contents: read

jobs:
  test:
    name: "Test: Rails ${{ matrix.rails }} on Ruby ${{ matrix.ruby }}"
    runs-on: ubuntu-latest
    # Overrides the workflow-level read-only default: this job's coverage entry pushes the
    # badge to the badges branch.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rails: "7.2"
            ruby: "3.2"

          - rails: "8.0"
            ruby: "3.3"

          # Measure coverage on this entry only.
          - rails: "8.1"
            ruby: "3.4"
            coverage: true

          - rails: "8.1"
            ruby: "4.0"

    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
      DISPLAY: ":99.0"

    steps:
      # Third party actions are pinned by commit SHA. A tag is mutable, so anyone able to
      # move it can change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout talks to the remote, so keep the token out of .git/config
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true

      - name: Gemfile
        run: echo $BUNDLE_GEMFILE

      - name: Ruby Version
        run: ruby --version

      - name: Run Tests
        run: bundle exec rake test

      - name: Publish Coverage Badge
        if: ${{ matrix.coverage && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Write a shields.io endpoint file from SimpleCov's summary.
          mkdir "$RUNNER_TEMP/badges"
          ruby -rjson -e '
            percent = JSON.parse(File.read("coverage/.last_run.json")).dig("result", "line")
            color   = {90 => "brightgreen", 80 => "green", 70 => "yellow", 60 => "orange"}.find { |min, _| percent >= min }&.last || "red"
            badge   = {schemaVersion: 1, label: "coverage", message: format("%.1f%%", percent), color: color}
            File.write(ARGV[0], JSON.generate(badge))
          ' "$RUNNER_TEMP/badges/coverage.json"
          # Replace the badges branch with a single commit so that it never accumulates history.
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update coverage badge"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.2"
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rake rubocop

      # docs/llms-full.txt is generated from the docs pages and checked in, so it can silently
      # go stale. Regenerate it and fail if that produced a diff.
      - name: Check docs/llms-full.txt is up to date
        run: |
          bundle exec rake llms_full
          git diff --exit-code docs/llms-full.txt
